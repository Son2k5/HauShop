services:
  mysql:
    image: mysql:8.4
    container_name: haushop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-haushop}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-haushop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - haushop-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: haushop-redis
    restart: unless-stopped
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    expose:
      - "6379"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - haushop-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: haushop-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "https://+:8443;http://+:8080"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/aspnetapp.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${ASPNETCORE_Kestrel__Certificates__Default__Password:?set ASPNETCORE_Kestrel__Certificates__Default__Password}
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-haushop};User=${MYSQL_USER:-haushop};Password=${MYSQL_PASSWORD:?set MYSQL_PASSWORD};"
      Database__ServerVersion: "8.4.0-mysql"
      Database__ApplyMigrationsOnStartup: "false"
      Database__MaxRetryCount: 2
      Database__MaxRetryDelaySeconds: 5
      Warmup__ProductSearch__Enabled: "false"
      Warmup__ProductSearch__DelaySeconds: 30
      Redis__Configuration: "redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false,connectRetry=1,connectTimeout=1000,syncTimeout=1000,asyncTimeout=1000"
      Redis__InstanceName: "haushop:"
      Redis__ProductListTtlMinutes: 10
      Redis__ProductDetailTtlMinutes: 30
      Redis__CategoryTtlMinutes: 60
      Redis__HomepageTtlMinutes: 5
      Redis__CartTtlHours: 24
      Redis__OtpTtlMinutes: 15
      RateLimiting__Login__PermitLimit: 5
      RateLimiting__Login__WindowSeconds: 300
      Jwt__Key: ${Jwt__Key:?set Jwt__Key}
      Jwt__Issuer: HauShopAPI
      Jwt__Audience: HauShopClient
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: https://localhost:3000
      Google__RedirectUri: "https://localhost:7288/api/auth/google/callback"
      Google__FrontendUrl: "http://localhost:5173"
      VnPay__TmnCode: ${VnPay__TmnCode:-}
      VnPay__HashSecret: ${VnPay__HashSecret:-}
      VnPay__BaseUrl: ${VnPay__BaseUrl:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VnPay__ReturnUrl: ${VnPay__ReturnUrl:-http://localhost:5173/payment/vnpay-return}
      AppUrl: "http://localhost:5173"
    volumes:
      - ./api/certs:/https:ro
    ports:
      - "8080:8080"
      - "7288:8443"
    networks:
      - haushop-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "https://localhost:7288/api"
        VITE_SIGNALR_URL: "https://localhost:7288/hubs/chat"
    container_name: haushop-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    networks:
      - haushop-network

volumes:
  mysql_data:
  redis_data:

networks:
  haushop-network:
    driver: bridge
