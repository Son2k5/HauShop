services:
  mysql:
    image: mysql:8.4
    container_name: haushop-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: haushop
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: haushop
      MYSQL_PASSWORD: haushop_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: haushop-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=mysql;Port=3306;Database=haushop;User=haushop;Password=haushop_password;
      Jwt__Key: change-this-development-key-to-a-long-random-secret-with-at-least-sixty-four-characters-1234567890
      Jwt__Issuer: HauShopAPI
      Jwt__Audience: HauShopClient
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: https://localhost:3000
      AppUrl: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
        VITE_SIGNALR_URL: http://localhost:8080/hubs/chat
    container_name: haushop-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  mysql_data:
